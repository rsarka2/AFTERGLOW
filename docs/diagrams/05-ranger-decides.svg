<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-label="The drone never decides. Pins: geofence rules open a pin as new; only the ranger's clicks move it to acknowledged, investigating, confirmed or cleared, and confirm works only from investigating. Thermal and SOS signals add flags to the pin under investigation but never confirm it. Flight plans: the planner proposes homing, grid or patrol legs; only the ranger's accept_leg makes a plan accepted, and an observer reads each leg to the pilot. Software can only mark a plan done or drop it. No software arrow ends at confirmed or accepted.">
  <title>The drone never decides</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1e293b; }
    .h1 { font-size: 22px; font-weight: 700; }
    .sub { font-size: 13.5px; fill: #64748b; }
    .zl { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; fill: #64748b; }
    .zs { font-size: 12px; fill: #64748b; }
    .bt { font-size: 13.5px; font-weight: 600; }
    .bs { font-size: 12px; fill: #475569; }
    .st { font-size: 13.5px; font-weight: 600; }
    .tp { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.3; }
    .pill { fill: #ffffff; stroke: #64748b; stroke-width: 1.4; }
    .end { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.3; }
    .yes { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2; }
    .sw { fill: none; stroke: #64748b; stroke-width: 1.6; }
    .hu { fill: none; stroke: #1d4ed8; stroke-width: 1.9; }
    .cap { font-size: 12.5px; fill: #64748b; }
  </style>

  <rect width="1120" height="600" fill="#ffffff"/>
  <text class="h1" x="24" y="42">The drone never decides</text>
  <text class="sub" x="24" y="66">Software proposes. Only a ranger's click moves a pin to confirmed or a plan to accepted. geofence.py and planner.py enforce it, and tests check it.</text>

  <!-- ============ PINS ============ -->
  <rect x="16" y="84" width="1088" height="234" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="zl" x="32" y="106">PINS</text>
  <text class="zs" x="76" y="106">status on ag/target · geofence.py accepts only these moves</text>

  <rect class="box" x="36" y="128" width="200" height="106" rx="8"/>
  <text class="bt" x="50" y="150">geofence rules</text>
  <text class="bs" x="50" y="170">patrol: off-trail, 2+ passes</text>
  <text class="bs" x="50" y="188">night: outside campgrounds</text>
  <text class="bs" x="50" y="206">search: any lost-device beacon</text>
  <text class="bs" x="50" y="224">an SOS answer, no open pin</text>

  <path class="sw" d="M236,181 H298" marker-end="url(#a)"/>
  <text class="bs" x="267" y="174" text-anchor="middle">opens</text>

  <rect class="pill" x="300" y="159" width="90" height="44" rx="22"/>
  <text class="st" x="345" y="186" text-anchor="middle">new</text>
  <rect class="pill" x="470" y="159" width="140" height="44" rx="22"/>
  <text class="st" x="540" y="186" text-anchor="middle">acknowledged</text>
  <rect class="pill" x="690" y="159" width="140" height="44" rx="22"/>
  <text class="st" x="760" y="186" text-anchor="middle">investigating</text>
  <rect class="yes" x="930" y="159" width="154" height="44" rx="22"/>
  <text class="st" x="1007" y="186" text-anchor="middle" style="fill:#1d4ed8">confirmed</text>
  <text class="bs" x="1007" y="222" text-anchor="middle" style="fill:#1d4ed8">a person, by the ranger</text>

  <path class="hu" d="M390,181 H468" marker-end="url(#ab)"/>
  <text class="tp" x="430" y="174" text-anchor="middle" style="fill:#1d4ed8">ack</text>
  <path class="hu" d="M610,181 H688" marker-end="url(#ab)"/>
  <text class="tp" x="650" y="174" text-anchor="middle" style="fill:#1d4ed8">investigate</text>
  <path class="hu" d="M830,181 H928" marker-end="url(#ab)"/>
  <text class="tp" x="879" y="174" text-anchor="middle" style="fill:#1d4ed8">confirm</text>
  <text class="bs" x="879" y="198" text-anchor="middle" font-size="10.5" style="fill:#1d4ed8">only from here</text>

  <path class="hu" d="M345,159 C345,122 760,122 760,157" marker-end="url(#ab)"/>
  <text class="tp" x="552" y="125" text-anchor="middle" style="fill:#1d4ed8">investigate</text>

  <rect class="end" x="470" y="254" width="140" height="44" rx="22"/>
  <text class="st" x="540" y="281" text-anchor="middle" style="fill:#475569">cleared</text>
  <path class="hu" d="M360,203 L468,266" marker-end="url(#ab)"/>
  <text class="tp" x="398" y="248" text-anchor="end" style="fill:#1d4ed8">clear</text>
  <path class="hu" d="M540,203 V252" marker-end="url(#ab)"/>
  <text class="tp" x="548" y="233" style="fill:#1d4ed8">clear</text>
  <path class="hu" d="M720,203 L612,266" marker-end="url(#ab)"/>
  <text class="tp" x="682" y="248" style="fill:#1d4ed8">clear</text>

  <rect class="box" x="850" y="242" width="234" height="66" rx="8" stroke-dasharray="5 4"/>
  <text class="bt" x="864" y="262" font-size="12.5">signs, never a confirm</text>
  <text class="bs" x="864" y="280">thermal hot near the pin → flag</text>
  <text class="bs" x="864" y="297">SOS answer → flag, prio 1 if hurt</text>
  <path class="sw" d="M862,242 L806,206" marker-end="url(#a)"/>

  <!-- ============ PLANS ============ -->
  <rect x="16" y="334" width="1088" height="210" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text class="zl" x="32" y="356">FLIGHT PLANS</text>
  <text class="zs" x="138" y="356">status on ag/plan · planner.py only proposes</text>

  <rect class="box" x="36" y="374" width="200" height="94" rx="8"/>
  <text class="bt" x="50" y="396">planner proposes</text>
  <text class="bs" x="50" y="416">pin investigating → homing</text>
  <text class="bs" x="50" y="434">mode search → grid</text>
  <text class="bs" x="50" y="452">mode patrol, night → patrol</text>

  <path class="sw" d="M236,421 H298" marker-end="url(#a)"/>
  <text class="bs" x="267" y="414" text-anchor="middle">new plan</text>

  <rect class="pill" x="300" y="399" width="110" height="44" rx="22"/>
  <text class="st" x="355" y="426" text-anchor="middle">proposed</text>
  <rect class="yes" x="500" y="399" width="120" height="44" rx="22"/>
  <text class="st" x="560" y="426" text-anchor="middle" style="fill:#1d4ed8">accepted</text>

  <path class="hu" d="M410,421 H498" marker-end="url(#ab)"/>
  <text class="tp" x="455" y="414" text-anchor="middle" style="fill:#1d4ed8">accept_leg</text>

  <rect class="box" x="690" y="396" width="210" height="50" rx="8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text class="bt" x="795" y="416" text-anchor="middle" font-size="12.5">observer reads the leg</text>
  <text class="bs" x="795" y="434" text-anchor="middle">heading + distance to pilot</text>
  <path class="hu" d="M620,421 H688" marker-end="url(#ab)"/>
  <text class="bs" x="655" y="414" text-anchor="middle" style="fill:#1d4ed8">each leg</text>

  <rect class="end" x="980" y="399" width="104" height="44" rx="22"/>
  <text class="st" x="1032" y="426" text-anchor="middle" style="fill:#475569">done</text>
  <path class="sw" d="M900,421 H978" marker-end="url(#a)"/>
  <text class="bs" x="939" y="411" text-anchor="middle" font-size="11">pod reached</text>
  <text class="bs" x="939" y="438" text-anchor="middle" font-size="11">the last leg</text>

  <rect class="end" x="500" y="480" width="120" height="40" rx="20"/>
  <text class="st" x="560" y="505" text-anchor="middle" style="fill:#475569">rejected</text>
  <path class="hu" d="M372,443 L498,494" marker-end="url(#ab)"/>
  <text class="tp" x="428" y="490" text-anchor="end" style="fill:#1d4ed8">reject_leg</text>
  <path class="hu" d="M560,443 V478" marker-end="url(#ab)"/>
  <text class="tp" x="568" y="466" style="fill:#1d4ed8">reject_leg (stop)</text>

  <text class="bs" x="700" y="494" font-style="italic">Software can only drop a plan: a newer one</text>
  <text class="bs" x="700" y="511" font-style="italic">replaces it, its pin closes, or a new search starts.</text>

  <!-- legend -->
  <line x1="24" y1="572" x2="56" y2="572" stroke="#1d4ed8" stroke-width="1.9"/>
  <text class="cap" x="64" y="576">a person acts (the ranger's clicks on the TV; the observer)</text>
  <line x1="464" y1="572" x2="496" y2="572" stroke="#64748b" stroke-width="1.6"/>
  <text class="cap" x="504" y="576">software</text>
  <text class="cap" x="1096" y="576" text-anchor="end" font-weight="700" style="fill:#1e293b">No software arrow ends at confirmed or accepted.</text>
</svg>
